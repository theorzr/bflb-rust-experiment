[package]
name = "bflb-embassy"
version = "0.1.0"
edition = "2024"
description = "Embassy Hardware Abstraction Layer (HAL) for BouffaloLab chips"
keywords = ["embedded", "async", "bouffalolab", "bl808", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]

[package.metadata.docs.rs]
features = ["bl808-m0", "defmt", "unstable-pac"]
targets = ["riscv32imac-unknown-none-elf"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["time-driver"]

## Enable defmt
defmt = ["dep:defmt", "embassy-hal-internal/defmt", "embassy-sync/defmt"]
## Enable log
log = ["dep:log"]

## Reexport the register blocks of the currently enabled chip at `bflb_embassy::pac` (unstable)
unstable-pac = []

## Use the RISC-V machine timer as the time driver for `embassy-time`, with a tick rate of 1 MHz.
## This takes ownership of the machine timer interrupt, so the callback-based API of
## `bflb_hal::time` is disabled (it panics).
time-driver = [
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "embassy-time-driver/tick-hz-1_000_000",
]

#! ### Chip selection features
## BL808, M0 core
bl808-m0 = ["bflb-hal/bl808-m0", "_gpio-glb-v2"]

# Internal features, selecting the register layout of the peripherals that differ
# between chip families. They are enabled by the chip features.
_gpio-glb-v2 = []

[dependencies]
bflb-hal = { path = "../bflb-hal", version = "0.1", features = ["bl-critical-section"] }
embedded-util = { path = "../embedded-util", version = "0.1" }

embassy-hal-internal = "0.5"
embassy-sync = "0.8"
embassy-time-driver = { version = "0.2", optional = true }
embassy-time-queue-utils = { version = "0.3", optional = true }

embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-io = "0.7"
embedded-io-async = "0.7"

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.14", optional = true }

critical-section = "1.1"
document-features = "0.2.7"
